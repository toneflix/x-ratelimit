name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Chrome, Firefox and Safari
        run: npm run build

      - name: Lint the Firefox build
        run: npx --yes web-ext@10.8.0 lint --source-dir dist/firefox

      - name: Package store uploads
        run: |
          npx tsx scripts/zip.ts chrome
          npx tsx scripts/zip.ts firefox

      - uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: dist/*.zip
          if-no-files-found: error
